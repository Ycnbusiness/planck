name: Instagram'a yayınla

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kuyruktaki gönderileri yayınla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/publish.py
      - name: Yayın kaydını depoya yaz
        run: |
          git config user.name "planck-bot"
          git config user.email "planck-bot@users.noreply.github.com"
          git add -A queue published
          git diff --cached --quiet || (git commit -m "Yayın kaydı" && git push)
